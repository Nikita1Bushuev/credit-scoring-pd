services:
  api:
    build: .
    container_name: credit-pd-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1

  mlflow:
    image: python:3.12-slim
    container_name: credit-pd-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./mlflow.db:/mlflow.db
    command: >
      bash -c "pip install mlflow==2.14.1 'sqlalchemy>=2.0,<2.1' &&
               mlflow ui --backend-store-uri sqlite:///mlflow.db --host 0.0.0.0"
